# Stage 4: 34-key matrix, LPPS pointing stick, AAAA battery level,
# DYA Studio modules, Prospector status advertisement, RGB LED widget.
# The DYA Studio block follows aerogu34_right.conf without its split-keyboard
# and PAW3222 settings. Build with the studio-rpc-usb-uart snippet.

# Only the Studio RPC CDC ACM port on USB (see the overlay).
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

# &mkp mouse buttons in the keymap, and the LPPS input listener
CONFIG_ZMK_POINTING=y
CONFIG_LPPS=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Battery level from the AAAA cell-sense divider (see &vbatt in the overlay).
# The driver converts with the NiMH table itself, so use its percentage
# rather than ZMK's lithium voltage formula.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_BT_BAS=y

# XIAO on-board RGB LED status widget (rgbled_adapter shield, as on aerogu34):
# battery level blink at power-on, BLE profile state on connect / profile
# change. Same thresholds as aerogu34.
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=40
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=20

# BLE
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_DIS=y

# ---- ZMK Studio / DYA Studio ----
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# Studio "Refresh List" notifications run on this shared queue and overflow
# its default stack (see zmk-module-runtime-input-processor README).
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096

# BLE management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Battery history (also while on USB)
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y
CONFIG_ZMK_BATTERY_SKIP_IF_USB_POWERED=n

# Idle / sleep settings
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Pointing tab: runtime input processors + live sensor stream
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# Fast keymap loading
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y

# Macro & Combo tab
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=63
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_COUNT=16
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=2048
# Stable behavior references for runtime macro/combo + fast-keymap.
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# Connection tab: OS detection + default layer selector
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# Custom Subsystems tab
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Troubleshooting tab
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1000

# ---- Prospector scanner: status advertisement ----
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Featherio"
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=100
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=10000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=2000
CONFIG_ZMK_STATUS_ADV_WPM_WINDOW_SECONDS=30
